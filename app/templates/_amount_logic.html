{% macro accordion(prefix) %}
  <div class="accordion mb-2" id="{{ prefix }}-advanced-accordion" data-amount-logic-root data-prefix="{{ prefix }}">
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#{{ prefix }}-advanced-collapse">
          Advanced
        </button>
      </h2>
      <div id="{{ prefix }}-advanced-collapse" class="accordion-collapse collapse">
        <div class="accordion-body">
          <div class="mb-2">
            <label class="form-label d-block">Amount logic</label>
            <div class="btn-group" role="group" aria-label="Amount logic type">
              <input type="radio" class="btn-check" name="{{ prefix }}-amount-logic-type" id="{{ prefix }}-logic-none" value="none" data-amount-logic-type checked>
              <label class="btn btn-outline-secondary btn-sm" for="{{ prefix }}-logic-none">None</label>
              <input type="radio" class="btn-check" name="{{ prefix }}-amount-logic-type" id="{{ prefix }}-logic-conditional" value="conditional" data-amount-logic-type>
              <label class="btn btn-outline-secondary btn-sm" for="{{ prefix }}-logic-conditional">Date-based</label>
              <input type="radio" class="btn-check" name="{{ prefix }}-amount-logic-type" id="{{ prefix }}-logic-escalating" value="escalating" data-amount-logic-type>
              <label class="btn btn-outline-secondary btn-sm" for="{{ prefix }}-logic-escalating">Increase/decrease</label>
            </div>
          </div>

          <div class="d-none" data-amount-logic-panel="conditional">
            <p class="small text-muted mb-1">Checked top to bottom; the first matching row wins, otherwise "Else amount" applies.</p>
            <template data-amount-logic-rule-template>
              <div class="d-flex flex-wrap gap-2 align-items-center mb-2" data-amount-logic-rule-row>
                <span class="small text-muted">If date on/after</span>
                <input type="number" min="1" max="12" placeholder="MM" class="form-control form-control-sm" style="max-width: 65px;" data-amount-logic-field="until_month">
                <input type="number" min="1" max="31" placeholder="DD" class="form-control form-control-sm" style="max-width: 65px;" data-amount-logic-field="until_day">
                <input type="number" placeholder="YYYY (optional)" class="form-control form-control-sm" style="max-width: 130px;" data-amount-logic-field="until_year">
                <span class="small text-muted">then amount is</span>
                <input type="number" step="0.01" placeholder="Amount" class="form-control form-control-sm" style="max-width: 120px;" data-amount-logic-field="amount">
                <button type="button" class="btn btn-outline-danger btn-sm" data-amount-logic-action="remove-rule"><i class="bi bi-x-lg"></i></button>
              </div>
            </template>
            <div data-amount-logic-rules></div>
            <button type="button" class="btn btn-outline-secondary btn-sm mb-2" data-amount-logic-action="add-rule">
              <i class="bi bi-plus-lg"></i> Add condition
            </button>
            <div class="mb-2">
              <label class="form-label">Else amount</label>
              <input type="number" step="0.01" class="form-control form-control-sm" style="max-width: 140px;" data-amount-logic-field="else_amount">
            </div>
          </div>

          <div class="d-none" data-amount-logic-panel="escalating">
            <div class="mb-2">
              <label class="form-label d-block">Direction</label>
              <div class="btn-group" role="group" aria-label="Escalation direction">
                <input type="radio" class="btn-check" name="{{ prefix }}-escalation-direction" id="{{ prefix }}-escalate-increase" value="increase" data-amount-logic-field="direction" checked>
                <label class="btn btn-outline-secondary btn-sm" for="{{ prefix }}-escalate-increase">Increase</label>
                <input type="radio" class="btn-check" name="{{ prefix }}-escalation-direction" id="{{ prefix }}-escalate-decrease" value="decrease" data-amount-logic-field="direction">
                <label class="btn btn-outline-secondary btn-sm" for="{{ prefix }}-escalate-decrease">Decrease</label>
              </div>
            </div>
            <div class="mb-2">
              <label class="form-label d-block">By, each occurrence</label>
              <div class="d-flex gap-2 align-items-center">
                <input type="number" step="0.01" min="0" class="form-control form-control-sm" style="max-width: 120px;" data-amount-logic-field="value">
                <select class="form-select form-select-sm" style="max-width: 150px;" data-amount-logic-field="adjustment_type">
                  <option value="amount">Flat amount</option>
                  <option value="percentage">Percent</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endmacro %}
