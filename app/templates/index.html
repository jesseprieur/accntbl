{% extends "base.html" %}

{% block title %}accntbl{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center">
    <h1 class="h3">accntbl</h1>
    <div>
      <button type="button" class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#add-transaction-modal"><i class="bi bi-plus-lg"></i> Add transaction</button>
      <a href="{{ url_for('main.recurring_series') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-repeat"></i> Recurring Series</a>
      <a href="{{ url_for('settings.index') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-gear"></i> Settings</a>
      <form method="post" action="{{ url_for('auth.logout') }}" class="d-inline">
        <button type="submit" class="btn btn-outline-secondary btn-sm"><i class="bi bi-box-arrow-right"></i> Log out</button>
      </form>
    </div>
  </div>

  <div class="modal fade" id="add-transaction-modal" tabindex="-1" aria-labelledby="add-transaction-modal-label" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="add-transaction-form">
          <div class="modal-header">
            <h2 class="modal-title h5" id="add-transaction-modal-label">Add transaction</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="text-danger small mb-2 d-none" id="add-transaction-error"></div>
            <div class="mb-2">
              <label class="form-label">Name</label>
              <input type="text" class="form-control form-control-sm" name="name" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Date</label>
              <input type="date" class="form-control form-control-sm" name="date" value="{{ today }}" required>
            </div>
            <div class="mb-2">
              <label class="form-label d-block">Kind</label>
              <div class="btn-group" role="group" aria-label="Kind">
                <input type="radio" class="btn-check" name="kind" id="add-transaction-kind-cash" value="cash" checked>
                <label class="btn btn-outline-primary btn-sm" for="add-transaction-kind-cash">Cash</label>
                <input type="radio" class="btn-check" name="kind" id="add-transaction-kind-credit" value="credit">
                <label class="btn btn-outline-primary btn-sm" for="add-transaction-kind-credit">Credit</label>
              </div>
            </div>
            <div class="mb-2 d-none" id="add-transaction-card-field">
              <label class="form-label">Credit card</label>
              <select class="form-select form-select-sm" name="credit_card_id" id="add-transaction-card-select">
                {% for card in credit_cards %}
                  <option value="{{ card.id }}" {% if card.id == default_credit_card_id %}selected{% endif %}>{{ card.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label">Amount</label>
              <input type="number" step="0.01" class="form-control form-control-sm" name="amount" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Notes</label>
              <input type="text" class="form-control form-control-sm" name="notes">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal"><i class="bi bi-x-lg"></i> Cancel</button>
            <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-check-lg"></i> Add</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="edit-estimate-modal" tabindex="-1" aria-labelledby="edit-estimate-modal-label" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="edit-estimate-form">
          <input type="hidden" name="credit_card_id">
          <input type="hidden" name="due_date">
          <div class="modal-header">
            <h2 class="modal-title h5" id="edit-estimate-modal-label">Edit payment-due estimate</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="text-danger small mb-2 d-none" id="edit-estimate-error"></div>
            <div class="mb-2">
              <label class="form-label">Amount</label>
              <input type="number" step="0.01" class="form-control form-control-sm" name="amount" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Notes</label>
              <input type="text" class="form-control form-control-sm" name="notes">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-danger btn-sm me-auto d-none" id="edit-estimate-clear"><i class="bi bi-x-circle"></i> Clear override</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal"><i class="bi bi-x-lg"></i> Cancel</button>
            <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-check-lg"></i> Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="form-check mt-3">
    <input class="form-check-input" type="checkbox" id="show-skipped-toggle">
    <label class="form-check-label" for="show-skipped-toggle">Show skipped occurrences</label>
  </div>

  <script id="credit-cards-data" type="application/json">{{ credit_cards_json | safe }}</script>

  <div id="transactions-window" data-today="{{ today }}" data-window-url="{{ url_for('transactions.window') }}" data-default-credit-card-id="{{ default_credit_card_id or '' }}" class="mt-2" style="max-height: 70vh; overflow-y: auto;">
    <table class="table table-sm align-middle mb-0">
      <thead class="sticky-top bg-white">
        <tr>
          <th>Date</th>
          <th>Name</th>
          <th>Cash</th>
          <th>Credit</th>
          <th>Running total</th>
          <th>Notes</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="transactions-tbody">
        <tr><td colspan="7" class="text-muted">Loading…</td></tr>
      </tbody>
    </table>
  </div>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/color_coding.js') }}"></script>
  <script src="{{ url_for('static', filename='js/validation.js') }}"></script>
  <script src="{{ url_for('static', filename='js/table.js') }}"></script>
{% endblock %}
